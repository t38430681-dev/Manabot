name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar projeto
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_MB'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ManaBot"
          include(":app")
          EOF_MB
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_MB'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_MB
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_MB'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_MB
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_MB'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.manabot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.manabot"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.1-v4"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              testOptions { unitTests.isReturnDefaultValues = true }
          }
          dependencies {
              testImplementation("junit:junit:4.13.2")
          }
          EOF_MB
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_MB'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:label="Mana Bot"
                  android:icon="@android:drawable/ic_media_play"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
          
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
          
                  <service
                      android:name=".BotAccessibilityService"
                      android:exported="true"
                      android:label="Mana Bot (toque)"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF_MB
          mkdir -p $(dirname app/src/main/res/xml/accessibility_service_config.xml)
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_MB'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/a11y_desc"
              android:notificationTimeout="100" />
          EOF_MB
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'EOF_MB'
          <resources>
              <string name="a11y_desc">Usado apenas para segurar e soltar a tela no puzzle Mana Control.</string>
          </resources>
          EOF_MB
          mkdir -p $(dirname app/src/main/java/com/manabot/Detector.kt)
          cat > app/src/main/java/com/manabot/Detector.kt <<'EOF_MB'
          package com.manabot
          
          import java.nio.ByteBuffer
          
          /**
           * Lê UMA linha horizontal (3 linhas médias) passando pelo centro do círculo e acha:
           *  - T: círculo fino mais externo (borda do disco de mana — é ele que você controla:
           *       segurar encolhe, soltar expande);
           *  - R: anel grosso (duas bordas) mais externo, que vira dourado quando "acerta".
           * Medido nos seus vídeos: o anel fica dourado ~90% das vezes quando T - R está entre ~38 e ~58 px
           * (em frame de 1068 px de largura).
           */
          object Detector {
              /**
               * ring  = anel grosso (a mana que você controla); NaN se não achou
               * inner/outer = os dois círculos finos da zona (separados ~30-46 px); NaN se não achou
               */
              class Reading(val ring: Float, val inner: Float, val outer: Float, val gold: Boolean, val confidence: Float = 0f, val centerX: Float = Float.NaN, val centerY: Float = Float.NaN)
              private class Run(val c: Float, val w: Int, val gold: Boolean)
          
              const val FRAME_W = 1068
          
              fun analyze(
                  buf: ByteBuffer, rowStride: Int, pixStride: Int, w: Int, h: Int,
                  cxFrac: Float, cyFrac: Float, prevMid: Float = Float.NaN, prevRing: Float = Float.NaN
              ): Reading? {
                  val cx = (cxFrac * w).toInt()
                  val cy = (cyFrac * h).toInt().coerceIn(1, h - 2)
                  val rmax = 160            // v3: 140 cortava a zona (O parava em 133) e o anel (128) nos SURGEs
                  if (cx - rmax < 0 || cx + rmax >= w) return null
                  val rg = ArrayList<Float>(2); val ins = ArrayList<Float>(2); val outs = ArrayList<Float>(2); var gold = false
                  for (sgn in intArrayOf(-1, 1)) {
                      val n = rmax - 8
                      val bright = BooleanArray(n); val gd = BooleanArray(n)
                      for (i in 0 until n) {
                          val x = cx + sgn * (i + 8)
                          var rr = 0; var gg = 0; var bb = 0
                          for (dy in -1..1) {
                              val o = (cy + dy) * rowStride + x * pixStride
                              if (o < 0 || o + 2 >= buf.limit()) continue
                              rr += buf.get(o).toInt() and 255
                              gg += buf.get(o + 1).toInt() and 255
                              bb += buf.get(o + 2).toInt() and 255
                          }
                          rr /= 3; gg /= 3; bb /= 3
                          val isGold = rr > 200 && gg > 140 && bb < 120
                          val warm = rr > 215 && rr - gg > 55 && bb < 235   // anel laranja/vermelho/rosa
                          gd[i] = isGold
                          bright[i] = isGold || warm || minOf(rr, gg, bb) > 190
                      }
                      val runs = ArrayList<Run>()
                      var i = 0
                      while (i < n) {
                          if (bright[i]) {
                              var j = i
                              while (j + 1 < n && bright[j + 1]) j++
                              var g = false
                              for (k in i..j) if (gd[k]) g = true
                              runs.add(Run((i + j) / 2f + 8f, j - i + 1, g))
                              i = j + 1
                          } else i++
                      }
                      // anel grosso mais externo (+ borda interna do par)
                      val thick = runs.filter { it.w >= 3 && it.c in 14f..150f }
                      var ringC = Float.NaN
                      if (thick.isNotEmpty()) {
                          // Sem histórico (ou salto), o anel é o mais externo até 128 px: acima disso só vale se vier
                          // por continuidade (evita confundir detalhes da borda do disco com o anel).
                          val base = thick.filter { it.c <= 128f }.ifEmpty { thick }
                          val chosen = if (prevRing.isFinite()) {
                              val nearest = thick.minByOrNull { Math.abs(it.c - prevRing) }!!
                              // Follow normal motion, but permit a large real radius jump during SURGE.
                              if (Math.abs(nearest.c - prevRing) <= 24f) nearest else base.maxByOrNull { it.c }!!
                          } else base.maxByOrNull { it.c }!!
                          val paired = thick.filter { it !== chosen && Math.abs(it.c - chosen.c) <= 10f }
                              .minByOrNull { Math.abs(it.c - chosen.c) }
                          ringC = if (paired != null) (chosen.c + paired.c) / 2f else chosen.c
                          rg.add(ringC)
                          if (thick.any { it.gold && Math.abs(it.c - ringC) <= 8f }) gold = true
                      }
                      // zona = par de círculos finos separados ~28..46 px. Escolhe o par mais próximo da zona anterior
                      // (a zona se move de forma contínua); sem histórico, o mais próximo do anel.
                      val thin = runs.filter { it.w <= 2 && it.c in 14f..155f }.map { it.c }.sorted()
                      var best: Pair<Float, Float>? = null; var bestScore = Float.MAX_VALUE
                      for (a in thin.indices) for (b in a + 1 until thin.size) {
                          val sep = thin[b] - thin[a]
                          if (sep < 28f || sep > 46f) continue
                          val mid = (thin[a] + thin[b]) / 2f
                          // continuidade: a zona anda < ~30 px/s; par muito longe da zona anterior é o círculo fixo do pentagrama (~31 px)
                          if (!prevMid.isNaN() && Math.abs(mid - prevMid) > 18f) continue
                          val score = when {
                              !prevMid.isNaN() -> Math.abs(mid - prevMid)
                              !ringC.isNaN() -> Math.abs(mid - ringC)
                              else -> -mid
                          }
                          if (score < bestScore) { bestScore = score; best = Pair(thin[a], thin[b]) }
                      }
                      if (best != null) { ins.add(best.first); outs.add(best.second) }
                      else if (!ringC.isNaN()) {
                          // sem par: um círculo só. Ignora o círculo fixo do pentagrama (~31 px).
                          val lo = thin.filter { it < ringC - 6f && it > 40f }.maxOrNull()
                          val hi = thin.filter { it > ringC + 6f }.minOrNull()
                          if (lo != null && ringC - lo <= 45f) ins.add(lo)
                          if (hi != null && hi - ringC <= 45f) outs.add(hi)
                      }
                  }
                  if (rg.isEmpty() && ins.isEmpty() && outs.isEmpty()) return null
                  fun avg(l: List<Float>) = if (l.isEmpty()) Float.NaN else l.average().toFloat()
                  val ring = avg(rg); val inner = avg(ins); val outer = avg(outs)
                  val confidence = ((rg.size.coerceAtMost(2) + ins.size.coerceAtMost(2) + outs.size.coerceAtMost(2)) / 6f).coerceIn(0f, 1f)
                  return Reading(ring, inner, outer, gold, confidence, cx.toFloat(), cy.toFloat())
              }
          }
          EOF_MB
          mkdir -p $(dirname app/src/main/java/com/manabot/Controller.kt)
          cat > app/src/main/java/com/manabot/Controller.kt <<'EOF_MB'
          package com.manabot

          import kotlin.math.abs

          /** Controlador v4. Muda em relação à v3 só o que os vídeos mostraram estar errado:
           *  - zona (par de círculos) some em ~30% dos quadros: agora é lembrada e extrapolada (até 1,2 s) em vez de soltar;
           *  - par falso (círculo fixo do pentagrama, ~31 px) é rejeitado por continuidade (a zona se move < ~30 px/s);
           *  - borda que some (anel encostado nela) é reconstruída com a largura lembrada (~40 px, constante);
           *  - anel que some por instantes é estimado pelo modelo, em vez de soltar às cegas. */
          class Controller {
              var zonePos = 0.5f
              var leadSec = 0.18f
              private var hold = false
              private var ring = Float.NaN
              private var velocity = 0f
              private var previousMeasurement = Float.NaN
              private var lastRingSeen = 0L
              private var targetInner = Float.NaN
              private var targetOuter = Float.NaN
              private var zoneMid = Float.NaN
              private var zoneVelocity = 0f
              private var zoneWidth = Float.NaN
              private var lastMeasMid = Float.NaN
              private var lastZoneSeen = 0L
              private var rejected = 0
              private var lastTime = 0L
              private var lastAnySeen = 0L
              private var estimatedAcceleration = 0f
              var target = Float.NaN; private set
              val estimatedRing get() = ring

              /** Meio geométrico da zona (já extrapolado) para o detector associar o par certo; vale por 400 ms. */
              fun currentMid(now: Long): Float = if (now - lastZoneSeen < 400) zoneMid else Float.NaN
              fun currentRing(): Float = if (now0 - lastRingSeen < 400) ring else Float.NaN
              private var now0 = 0L

              fun update(rd: Detector.Reading?, now: Long): Boolean {
                  now0 = now
                  val dt = if (lastTime == 0L) 1f / 30f else ((now - lastTime) / 1000f).coerceIn(0.008f, 0.12f)
                  lastTime = now
                  val oldVelocity = velocity

                  // 1) prevê a zona (continua o movimento dela enquanto não há medida)
                  val zoneAge = (now - lastZoneSeen) / 1000f
                  if (zoneMid.isFinite() && zoneAge <= ZONE_HOLD_S) {
                      val s = zoneVelocity * dt
                      zoneMid += s; targetInner += s; targetOuter += s
                      zoneVelocity *= 0.985f
                  }

                  var ringMeasured = false
                  if (rd != null) {
                      val hasRing = rd.ring.isFinite() && rd.ring > 8f && rd.ring < 165f
                      val hasInner = rd.inner.isFinite() && rd.inner > 10f
                      val hasOuter = rd.outer.isFinite() && rd.outer > 10f
                      if (hasRing || hasInner || hasOuter) lastAnySeen = now

                      if (hasRing) {
                          if (previousMeasurement.isFinite() && now - lastRingSeen < 300) {
                              val raw = ((rd.ring - previousMeasurement) / dt).coerceIn(-100f, 100f)
                              velocity = 0.58f * velocity + 0.42f * raw
                              val rawAccel = ((velocity - oldVelocity) / dt).coerceIn(-350f, 350f)
                              estimatedAcceleration = 0.8f * estimatedAcceleration + 0.2f * rawAccel
                          } else {
                              velocity = 0f
                              estimatedAcceleration = 0f
                          }
                          previousMeasurement = rd.ring
                          ring = rd.ring
                          lastRingSeen = now
                          ringMeasured = true
                      }
                      measureZone(rd.inner.takeIf { hasInner } ?: Float.NaN, rd.outer.takeIf { hasOuter } ?: Float.NaN, now)
                  }

                  // 2) anel fora de vista por instantes (encostado na zona, laranja/vermelho, além do alcance): modelo
                  if (!ringMeasured && ring.isFinite() && now - lastRingSeen < RING_HOLD_MS) {
                      velocity += ((if (hold) -40f else 43f) - 2.5f * velocity) * dt
                      ring = (ring + velocity * dt).coerceIn(0f, 200f)
                  }

                  val ageAny = now - lastAnySeen
                  val ageZone = (now - lastZoneSeen) / 1000f
                  val ageRing = now - lastRingSeen
                  if (ageAny > 700L) { reset(); return false }
                  if (ageZone > ZONE_HOLD_S || ageRing > RING_HOLD_MS || !ring.isFinite() || !zoneMid.isFinite()) {
                      hold = false
                      return false
                  }

                  // 3) decisão (igual à v3, com folga maior nas bordas: o anel fica laranja a ~5 px da borda interna)
                  val delay = leadSec.coerceIn(0f, 0.5f)
                  val predictedRing = ring + velocity * delay + 0.5f * estimatedAcceleration * delay * delay
                  val width = (targetOuter - targetInner).coerceIn(12f, 60f)
                  val predictedZoneShift = (zoneVelocity * delay).coerceIn(-width * 0.65f, width * 0.65f)
                  val predictedInner = targetInner + predictedZoneShift
                  val predictedOuter = targetOuter + predictedZoneShift
                  target = predictedInner + zonePos.coerceIn(0.05f, 0.95f) * (predictedOuter - predictedInner)

                  val margin = (abs(velocity) * delay * 0.12f + 1.2f).coerceIn(1.2f, minOf(4.0f, width * 0.18f))
                  val innerSafety = predictedInner + maxOf(INNER_SAFE, width * 0.2f)
                  val outerSafety = predictedOuter - maxOf(OUTER_SAFE, width * 0.12f)
                  when {
                      predictedRing <= innerSafety -> hold = false
                      predictedRing >= outerSafety -> hold = true
                      predictedRing > target + margin -> hold = true
                      predictedRing < target - margin -> hold = false
                  }
                  return hold
              }

              private fun measureZone(inner: Float, outer: Float, now: Long) {
                  val age = ((now - lastZoneSeen) / 1000f).coerceAtMost(2f)
                  val known = zoneMid.isFinite() && age <= ZONE_HOLD_S
                  val widthKnown = zoneWidth.isFinite()
                  var cInner = Float.NaN; var cOuter = Float.NaN
                  var pair = false
                  if (inner.isFinite() && outer.isFinite()) {
                      val w = outer - inner
                      if (w in 12f..60f && (!widthKnown || !known || abs(w - zoneWidth) <= 10f)) { cInner = inner; cOuter = outer; pair = true }
                      else if (known && widthKnown) {
                          // largura incoerente: fica com a borda mais perto do esperado e reconstrói a outra
                          val eIn = abs(inner - (zoneMid - zoneWidth / 2)); val eOut = abs(outer - (zoneMid + zoneWidth / 2))
                          if (eIn <= eOut) { cInner = inner; cOuter = inner + zoneWidth } else { cOuter = outer; cInner = outer - zoneWidth }
                      }
                  } else if (known && widthKnown) {
                      if (inner.isFinite()) { cInner = inner; cOuter = inner + zoneWidth }
                      else if (outer.isFinite()) { cOuter = outer; cInner = outer - zoneWidth }
                  }
                  if (!cInner.isFinite()) return
                  val mid = (cInner + cOuter) / 2f
                  if (known) {
                      val gate = 12f + 30f * age
                      if (abs(mid - zoneMid) > gate) {
                          // salto maior que a zona consegue andar: leitura falsa (ex.: círculo do pentagrama). Só aceita se persistir.
                          rejected++
                          if (rejected < 5) return
                      }
                  }
                  rejected = 0
                  if (lastMeasMid.isFinite() && (now - lastZoneSeen) < 300L) {
                      val dz = ((mid - lastMeasMid) / ((now - lastZoneSeen) / 1000f).coerceAtLeast(0.016f)).coerceIn(-60f, 60f)
                      zoneVelocity = 0.65f * zoneVelocity + 0.35f * dz
                  } else zoneVelocity = 0f
                  if (pair) zoneWidth = if (widthKnown) 0.9f * zoneWidth + 0.1f * (cOuter - cInner) else (cOuter - cInner)
                  lastMeasMid = mid
                  zoneMid = mid; targetInner = cInner; targetOuter = cOuter
                  lastZoneSeen = now
              }

              fun reset() {
                  hold = false
                  ring = Float.NaN; velocity = 0f; previousMeasurement = Float.NaN; lastRingSeen = 0L
                  targetInner = Float.NaN; targetOuter = Float.NaN; zoneMid = Float.NaN
                  zoneVelocity = 0f; zoneWidth = Float.NaN; lastMeasMid = Float.NaN
                  lastTime = 0L; lastZoneSeen = 0L; lastAnySeen = 0L; rejected = 0
                  estimatedAcceleration = 0f; target = Float.NaN
              }

              companion object {
                  const val ZONE_HOLD_S = 1.2f
                  const val RING_HOLD_MS = 600L
                  const val INNER_SAFE = 8f
                  const val OUTER_SAFE = 5f
              }
          }
          EOF_MB
          mkdir -p $(dirname app/src/main/java/com/manabot/BotAccessibilityService.kt)
          cat > app/src/main/java/com/manabot/BotAccessibilityService.kt <<'EOF_MB'
          package com.manabot
          
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          
          /**
           * Segura/solta a tela com UM traço longo (sem continueStroke, que estava cancelando/recompletando
           * ~250x por segundo e travando a thread principal). Segurar = despacha um toque de 55 s.
           * Soltar = despacha um toque de 1 ms no mesmo ponto (um novo gesto cancela o anterior, o dedo sobe).
           * Há intervalo mínimo entre despachos e recuo se o sistema cancelar o toque logo após começar.
           */
          class BotAccessibilityService : AccessibilityService() {
              companion object {
                  @Volatile var instance: BotAccessibilityService? = null
                  private const val HOLD_MS = 55000L
                  private const val MIN_GAP_MS = 25L
                  @Volatile var okCount = 0        // despachos aceitos
                  @Volatile var cancelCount = 0    // cancelados pelo sistema (não por nós)
                  @Volatile var failCount = 0      // despacho recusado
              }
          
              private val main = Handler(Looper.getMainLooper())
              @Volatile private var wantHold = false
              private var holding = false
              private var seq = 0
              private var lastDispatch = 0L
              private var pressedAt = 0L
              private var retryPending = false
              var x = 0f; var y = 0f
          
              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() { setHold(false) }
              override fun onDestroy() { instance = null; super.onDestroy() }
          
              fun setHold(h: Boolean) { wantHold = h; main.post { sync() } }
          
              private fun later(ms: Long) {
                  if (retryPending) return
                  retryPending = true
                  main.postDelayed({ retryPending = false; sync() }, ms)
              }
          
              private fun sync() {
                  try {
                      if (wantHold == holding) return
                      val wait = MIN_GAP_MS - (SystemClock.uptimeMillis() - lastDispatch)
                      if (wait > 0) { later(wait); return }
                      if (wantHold) press() else release()
                  } catch (e: Exception) { failCount++ }
              }
          
              private fun press() {
                  val id = ++seq
                  val p = Path().apply { moveTo(x, y); lineTo(x + 1f, y) }
                  val ok = dispatchGesture(
                      GestureDescription.Builder().addStroke(StrokeDescription(p, 0, HOLD_MS)).build(),
                      object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) {
                              // acabou os 55 s: se ainda queremos segurar, pressiona de novo
                              if (id == seq && holding) { holding = false; sync() }
                          }
                          override fun onCancelled(g: GestureDescription?) {
                              if (id != seq || !holding) return   // cancelado por nós (soltar): ignora
                              cancelCount++
                              holding = false
                              // se o sistema cancelou logo após começar, espera antes de tentar de novo (sem laço quente)
                              later(if (SystemClock.uptimeMillis() - pressedAt < 150) 200L else MIN_GAP_MS)
                          }
                      }, null
                  )
                  lastDispatch = SystemClock.uptimeMillis()
                  if (ok) { okCount++; holding = true; pressedAt = lastDispatch } else { failCount++; later(100L) }
              }
          
              private fun release() {
                  seq++            // ignora os callbacks do traço longo
                  holding = false
                  val p = Path().apply { moveTo(x, y); lineTo(x + 1f, y) }
                  val ok = dispatchGesture(
                      GestureDescription.Builder().addStroke(StrokeDescription(p, 0, 1L)).build(), null, null
                  )
                  lastDispatch = SystemClock.uptimeMillis()
                  if (ok) okCount++ else failCount++
              }
          }
          EOF_MB
          mkdir -p $(dirname app/src/main/java/com/manabot/CaptureService.kt)
          cat > app/src/main/java/com/manabot/CaptureService.kt <<'EOF_MB'
          package com.manabot
          
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          
          class CaptureService : Service() {
              private var projection: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private lateinit var thread: HandlerThread
              private val controller = Controller()
              private var overlay: TextView? = null
              private var dot: android.view.View? = null
              private var wm: WindowManager? = null
              @Volatile private var enabled = false
              private var lastCfg = 0L
              private var cx = 0.499f; private var cy = 0.498f
              private var tx = 0.68f; private var ty = 0.60f
              private var frames = 0; private var lastUi = 0L
          
              override fun onBind(i: Intent?): IBinder? = null
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (projection != null) return START_NOT_STICKY   // já rodando: ignora segundo início (vazava thread/projeção)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("mana", "Mana Bot", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "mana").setContentTitle("Mana Bot ativo")
                      .setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
          
                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(code, data)
                  thread = HandlerThread("mana-cap").also { it.start() }
                  val handler = Handler(thread.looper)
                  projection!!.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)
          
                  // Sempre paisagem: lado maior = largura. Em retrato o conteúdo aparece pequeno até o Roblox girar a tela.
                  val dm = resources.displayMetrics
                  val long = maxOf(dm.widthPixels, dm.heightPixels).toFloat()
                  val short = minOf(dm.widthPixels, dm.heightPixels).toFloat()
                  val w = Detector.FRAME_W
                  val h = (w * short / long).toInt()
                  reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  vd = projection!!.createVirtualDisplay(
                      "mana", w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface, null, handler
                  )
                  reader!!.setOnImageAvailableListener({ r -> onFrame(r, w, h) }, handler)
                  showOverlay()
                  return START_NOT_STICKY
              }
          
              private fun loadCfg() {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  controller.zonePos = p.getFloat("gap", 50f) / 100f
                  controller.leadSec = p.getFloat("lead3", 260f) / 1000f
                  cx = p.getFloat("cx", 49.9f) / 100f; cy = p.getFloat("cy", 49.8f) / 100f
                  tx = p.getFloat("tx", 68f) / 100f; ty = p.getFloat("ty", 60f) / 100f
              }
          
              private fun onFrame(r: ImageReader, w: Int, h: Int) {
                  val img = try { r.acquireLatestImage() } catch (e: Exception) { null } ?: return
                  try {
                      val now = SystemClock.uptimeMillis()
                      if (now - lastCfg > 700) { loadCfg(); lastCfg = now }
                      val pl = img.planes[0]
                      val rd = Detector.analyze(pl.buffer, pl.rowStride, pl.pixelStride, w, h, cx, cy, controller.currentMid(now), controller.currentRing())
                      val svc = BotAccessibilityService.instance
                      val hold: Boolean
                      if (enabled) {
                          hold = controller.update(rd, now)
                          val dm = resources.displayMetrics
                          val lw = maxOf(dm.widthPixels, dm.heightPixels); val lh = minOf(dm.widthPixels, dm.heightPixels)
                          svc?.x = tx * lw; svc?.y = ty * lh
                          svc?.setHold(hold)
                      } else { hold = false; controller.reset(); svc?.setHold(false) }
                      frames++
                      if (now - lastUi > 150) {
                          lastUi = now
                          val txt = (if (enabled) "ON " else "OFF") + (if (svc == null) " (sem acessib.)" else "") +
                              if (rd != null) " R=%.0f%s I=%.0f O=%.0f alvo=%.0f %s%s".format(if (rd.ring.isNaN()) controller.estimatedRing else rd.ring,
                                  if (rd.ring.isNaN()) "~" else "", rd.inner, rd.outer, controller.target,
                                  if (hold) "SEGURA" else "solta", if (rd.gold) " *" else "") else " sem leitura"
                          val diag = " | toque ok=%d canc=%d falha=%d".format(BotAccessibilityService.okCount, BotAccessibilityService.cancelCount, BotAccessibilityService.failCount)
                          overlay?.post { overlay?.text = txt + diag }
                          dot?.post { dot?.visibility = if (hold) android.view.View.VISIBLE else android.view.View.INVISIBLE }
                      }
                  } catch (e: Exception) {
                      // nunca deixa uma exceção de quadro derrubar o app: solta e segue no próximo quadro
                      try { BotAccessibilityService.instance?.setHold(false) } catch (_: Exception) {}
                  } finally { try { img.close() } catch (_: Exception) {} }
              }
          
              private fun showOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val tv = TextView(this).apply {
                      text = "OFF"; textSize = 11f; setTextColor(0xFFFFFFFF.toInt()); setBackgroundColor(0xCC222222.toInt())
                      setPadding(16, 10, 16, 10)
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 200; y = 120 }
                  var sx = 0f; var sy = 0f; var ox = 0; var oy = 0; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              if (Math.abs(e.rawX - sx) > 12 || Math.abs(e.rawY - sy) > 12) moved = true
                              if (moved) { lp.x = ox + (e.rawX - sx).toInt(); lp.y = oy + (e.rawY - sy).toInt(); wm?.updateViewLayout(tv, lp) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) { enabled = !enabled }   // toque = liga/desliga
                      }
                      true
                  }
                  try { wm!!.addView(tv, lp); overlay = tv } catch (e: Exception) { stopSelf(); return }
                  // bolinha vermelha = onde o app está tocando (aparece só enquanto SEGURA)
                  val dm = resources.displayMetrics
                  val lw = maxOf(dm.widthPixels, dm.heightPixels); val lh = minOf(dm.widthPixels, dm.heightPixels)
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  val d = android.view.View(this).apply {
                      background = android.graphics.drawable.GradientDrawable().apply { shape = android.graphics.drawable.GradientDrawable.OVAL; setColor(0x99FF0000.toInt()) }
                      visibility = android.view.View.INVISIBLE
                  }
                  val dl = WindowManager.LayoutParams(
                      48, 48, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START
                      x = (p.getFloat("tx", 68f) / 100f * lw).toInt() - 24; y = (p.getFloat("ty", 60f) / 100f * lh).toInt() - 24 }
                  try { wm!!.addView(d, dl); dot = d } catch (e: Exception) {}
              }
          
              override fun onDestroy() {
                  try { BotAccessibilityService.instance?.setHold(false) } catch (_: Exception) {}
                  try { reader?.setOnImageAvailableListener(null, null) } catch (_: Exception) {}
                  try { overlay?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  try { dot?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  try { vd?.release() } catch (_: Exception) {}
                  try { reader?.close() } catch (_: Exception) {}
                  try { projection?.stop() } catch (_: Exception) {}
                  if (::thread.isInitialized) thread.quitSafely()
                  super.onDestroy()
              }
          }
          EOF_MB
