          package com.manabot
          
          import java.nio.ByteBuffer
          import kotlin.math.sqrt
          import org.junit.Assert.*
          import org.junit.Test
          
          class CoreRegressionTest {
              private fun syntheticFrame(w: Int = 400, h: Int = 300): ByteBuffer {
                  val buffer = ByteBuffer.allocate(w * h * 4)
                  for (y in 0 until h) for (x in 0 until w) {
                      val i = (y * w + x) * 4
                      buffer.put(i, 20.toByte()); buffer.put(i + 1, 20.toByte())
                      buffer.put(i + 2, 20.toByte()); buffer.put(i + 3, 255.toByte())
                  }
                  val cx = 0.536f * w; val cy = 0.517f * h
                  for (y in 0 until h) for (x in 0 until w) {
                      val radius = sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy))
                      val edge = radius in 67.5..70.0 || radius in 91.0..93.0
                      val ring = radius in 77.0..83.0
                      if (edge || ring) {
                          val i = (y * w + x) * 4
                          buffer.put(i, if (ring) 250.toByte() else 245.toByte())
                          buffer.put(i + 1, if (ring) 210.toByte() else 245.toByte())
                          buffer.put(i + 2, if (ring) 60.toByte() else 245.toByte())
                      }
                  }
                  return buffer
              }
          
              @Test fun detectsSyntheticConcentricRings() {
                  val w = 400; val h = 300
                  val result = Detector.analyze(syntheticFrame(w, h), w * 4, 4, w, h, .536f, .517f)
                  assertNotNull(result)
                  assertTrue(result!!.ring in 75f..85f)
                  assertTrue(result.inner in 63f..74f)
                  assertTrue(result.outer in 87f..98f)
              }
          
              @Test fun rejectsBlankFrame() {
                  val w = 400; val h = 300
                  assertNull(Detector.analyze(ByteBuffer.allocate(w * h * 4), w * 4, 4, w, h, .536f, .517f))
              }
          
              private fun frameWithCircles(w: Int, h: Int, cxf: Float, cyf: Float, thin: List<Float>, ringR: Float): ByteBuffer {
                  val buffer = ByteBuffer.allocate(w * h * 4)
                  val cx = cxf * w; val cy = cyf * h
                  for (y in 0 until h) for (x in 0 until w) {
                      val i = (y * w + x) * 4
                      val radius = sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy))
                      var rr = 20; var gg = 20; var bb = 20
                      if (thin.any { Math.abs(radius - it) < 1.0 }) { rr = 245; gg = 245; bb = 245 }
                      if (Math.abs(radius - ringR) < 3.0) { rr = 245; gg = 245; bb = 250 }
                      buffer.put(i, rr.toByte()); buffer.put(i + 1, gg.toByte()); buffer.put(i + 2, bb.toByte()); buffer.put(i + 3, 255.toByte())
                  }
                  return buffer
              }

              @Test fun rejectsPentagramCirclePairAndKeepsRealZone() {
                  val w = 1068; val h = 600
                  // zona real (72..112, meio 92) escondida pelo anel; so aparecem o circulo fixo do pentagrama (31) e um circulo
                  // solto em 74. O par (31,74) tem largura plausivel (43) mas meio 52, ~40 px da zona anterior: e falso.
                  val frame = frameWithCircles(w, h, .5f, .5f, listOf(31f, 74f), 90f)
                  val r = Detector.analyze(frame, w * 4, 4, w, h, .5f, .5f, 92f, 90f)
                  assertNotNull(r)
                  assertTrue("inner=${r!!.inner}", r.inner.isNaN() || r.inner > 60f)
              }

              @Test fun seesZoneAndRingBeyondOldLimit() {
                  val w = 1068; val h = 600
                  // zona 115..155 e anel em 140: a v3 cortava em 133/128 e perdia tudo isso
                  val frame = frameWithCircles(w, h, .5f, .5f, listOf(115f, 155f), 140f)
                  val r = Detector.analyze(frame, w * 4, 4, w, h, .5f, .5f, 135f, 140f)
                  assertNotNull(r)
                  assertTrue("ring=${r!!.ring}", r.ring in 136f..144f)
                  assertTrue("outer=${r.outer}", r.outer in 152f..158f)
              }

              @Test fun controllerKeepsControllingThroughZoneDropout() {
                  val controller = Controller().apply { leadSec = .1f; zonePos = .5f }
                  var now = 1_000L
                  repeat(10) { controller.update(Detector.Reading(95f, 69f, 109f, false, 1f), now); now += 33L }
                  // zona some por 0,5 s com o anel acima do alvo: tem de continuar SEGURANDO, nao soltar
                  var hold = false
                  repeat(15) { hold = controller.update(Detector.Reading(95f, Float.NaN, Float.NaN, false, .3f), now); now += 33L }
                  assertTrue("deveria continuar segurando sem a zona", hold)
                  // zona some por mais de 1,2 s: solta
                  repeat(45) { hold = controller.update(Detector.Reading(95f, Float.NaN, Float.NaN, false, .3f), now); now += 33L }
                  assertFalse(hold)
              }

              @Test fun controllerIgnoresFalsePairJump() {
                  val controller = Controller().apply { leadSec = .1f; zonePos = .5f }
                  var now = 1_000L
                  repeat(10) { controller.update(Detector.Reading(95f, 72f, 112f, false, 1f), now); now += 33L }
                  // 3 quadros com par falso (31, 63): nao pode puxar o alvo para ~47
                  repeat(3) { controller.update(Detector.Reading(95f, 31f, 63f, false, 1f), now); now += 33L }
                  assertTrue("alvo=${controller.target}", controller.target > 80f)
              }

              @Test fun controllerKeepsRingNearBandAndReleasesWhenStale() {
                  val controller = Controller().apply { leadSec = .1f; zonePos = .5f }
                  var now = 1_000L
                  var radius = 82f
                  var hold = false
                  repeat(90) {
                      hold = controller.update(Detector.Reading(radius, 69f, 92f, false, 1f), now)
                      radius += if (hold) -0.7f else 0.7f
                      radius = radius.coerceIn(45f, 120f)
                      now += 33L
                  }
                  assertTrue("radius drifted outside the safe test band: $radius", radius in 62f..99f)
                  assertFalse(controller.update(null, now + 1_000L))
              }
          }
          EOF_MB
