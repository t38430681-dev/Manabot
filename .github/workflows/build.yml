          package com.manabot
          
          import java.nio.ByteBuffer
          import kotlin.math.sqrt
          import org.junit.Assert.*
          import org.junit.Test
          
          class CoreRegressionTest {
              private fun syntheticFrame(w: Int = 400, h: Int = 300): ByteBuffer {
                  val buffer = ByteBuffer.allocate(w * h * 4)
                  for (y in 0 until h) for (x in 0 until w) {
                      val i = (y * w + x) * 4
                      buffer.put(i, 20.toByte()); buffer.put(i + 1, 20.toByte())
                      buffer.put(i + 2, 20.toByte()); buffer.put(i + 3, 255.toByte())
                  }
                  val cx = 0.536f * w; val cy = 0.517f * h
                  for (y in 0 until h) for (x in 0 until w) {
                      val radius = sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy))
                      val edge = radius in 67.5..70.0 || radius in 91.0..93.0
                      val ring = radius in 77.0..83.0
                      if (edge || ring) {
                          val i = (y * w + x) * 4
                          buffer.put(i, if (ring) 250.toByte() else 245.toByte())
                          buffer.put(i + 1, if (ring) 210.toByte() else 245.toByte())
                          buffer.put(i + 2, if (ring) 60.toByte() else 245.toByte())
                      }
                  }
                  return buffer
              }
          
              @Test fun detectsSyntheticConcentricRings() {
                  val w = 400; val h = 300
                  val result = Detector.analyze(syntheticFrame(w, h), w * 4, 4, w, h, .536f, .517f)
                  assertNotNull(result)
                  assertTrue(result!!.ring in 75f..85f)
                  assertTrue(result.inner in 63f..74f)
                  assertTrue(result.outer in 87f..98f)
              }
          
              @Test fun rejectsBlankFrame() {
                  val w = 400; val h = 300
                  assertNull(Detector.analyze(ByteBuffer.allocate(w * h * 4), w * 4, 4, w, h, .536f, .517f))
              }
          
              @Test fun controllerKeepsRingNearBandAndReleasesWhenStale() {
                  val controller = Controller().apply { leadSec = .1f; zonePos = .5f }
                  var now = 1_000L
                  var radius = 82f
                  var hold = false
                  repeat(90) {
                      hold = controller.update(Detector.Reading(radius, 69f, 92f, false, 1f), now)
                      radius += if (hold) -0.7f else 0.7f
                      radius = radius.coerceIn(45f, 120f)
                      now += 33L
                  }
                  assertTrue("radius drifted outside the safe test band: $radius", radius in 62f..99f)
                  assertFalse(controller.update(null, now + 1_000L))
              }
          }
          EOF_MB
